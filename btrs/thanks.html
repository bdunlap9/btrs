<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request received — Bailey The Restorian</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#DC4402">
<link rel="icon" href="icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow+Semi+Condensed:wght@600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--orange:#DC4402;--blue:#0040A2;--bone:#EDE6DA;--ink:#0A0A0C}
*{box-sizing:border-box}
body{
  margin:0;background:var(--orange);color:var(--ink);
  font-family:"Barlow","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 20px;
}
.box{max-width:620px;text-align:center}
h1{
  font-family:"Barlow Condensed",Impact,sans-serif;font-style:italic;font-weight:800;
  text-transform:uppercase;font-size:clamp(42px,9vw,78px);line-height:.92;margin:0 0 18px;
  color:var(--bone);text-shadow:4px 4px 0 var(--ink);
}
.eyebrow{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.2em;font-size:12.5px;color:#2A1004;margin:0 0 14px;
}
p{color:#2A1004;font-weight:500;max-width:48ch;margin:0 auto 14px}
.call{
  display:inline-flex;flex-direction:column;align-items:center;margin-top:26px;
  background:var(--blue);color:#fff;text-decoration:none;
  border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px 30px;
  font-family:"Barlow Condensed",Impact,sans-serif;font-style:italic;font-weight:800;
  text-transform:uppercase;font-size:clamp(26px,5vw,38px);line-height:1;
  transition:transform .12s ease,box-shadow .12s ease;
}
.call small{
  font-family:"Barlow Semi Condensed",sans-serif;font-style:normal;font-weight:600;
  font-size:12px;letter-spacing:.18em;color:#B7D0FF;margin-bottom:4px;
}
.call:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.back{
  display:inline-block;margin-top:30px;color:#2A1004;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.12em;font-size:13px;
}
a:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="box">
    <p class="eyebrow">Request received</p>
    <h1>Got it.<br>We'll be in touch.</h1>
    <p>Your request came through and we'll get back to you as soon as we can to set up a time.</p>
    <p><b>If water is actively spreading right now, don't wait on us to call back.</b></p>
    <a class="call" href="tel:+13213004076"><small>Call 24 hours</small>(321) 300-4076</a>
    <div><a class="back" href="/">&larr; Back to the site</a></div>
  </div>
</body>
</html>
